description = "Build FlowCloudAI plugin package (.fcplug)"

[dependencies]
anyhow = "1"
zip = "8.2.0"
image = "0.25"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"