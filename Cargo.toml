[package]
name = "cargo-fcplug"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Build FlowCloudAI plugin package (.fcplug)"

[profile.release]
opt-level = "z"          # 优化大小
lto = true               # 链接时优化
codegen-units = 1        # 减少并行编译单元，提高优化
strip = "symbols"        # 去除符号表（需 Rust 1.59+）
panic = "abort"          # 如果不需要 unwind，可减小体积

[dependencies]
anyhow = "1"
zip = "8.2.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0.6"
url = "2"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rpassword = "7"
